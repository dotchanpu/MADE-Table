<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MADE · 部署全流程仪表盘</title>
    <link rel="stylesheet" href="/static/styles.css?v=20261014-events-primary" />
  </head>
  <body>
    <main class="dashboard-shell">
      <header class="dashboard-header">
        <div class="header-leading">
          <button id="back-button" class="back-button" type="button" aria-label="返回上一页"><span aria-hidden="true">←</span>返回</button>
          <div class="header-title">
            <div class="eyebrow">MADE · MODEL DEPLOYMENT ENGINE</div>
            <h1>部署全流程仪表盘</h1>
          </div>
        </div>
        <div class="header-controls">
          <label class="run-picker"><span>运行记录</span><select id="run-select" aria-label="选择运行记录"><option>读取中…</option></select></label>
          <button id="refresh-button" class="refresh-button" type="button">刷新</button>
        </div>
      </header>

      <section class="run-context" aria-label="当前运行概况">
        <div class="run-identity"><span class="context-label">当前运行</span><strong id="run-title">正在读取运行记录</strong></div>
        <div class="context-metrics">
          <div class="context-metric"><span class="context-label">整体状态</span><span id="run-status" class="status-pill neutral">读取中</span></div>
          <div class="context-metric"><span class="context-label">模型服务</span><strong id="provider-badge">—</strong></div>
          <div class="context-metric"><span class="context-label">容器</span><strong id="container-status">—</strong></div>
          <div class="context-metric"><span class="context-label">最近更新</span><strong id="last-updated">—</strong></div>
        </div>
      </section>

      <section class="pipeline-panel" aria-labelledby="pipeline-title">
        <div class="section-heading">
          <h2 id="pipeline-title">总体流程</h2>
        </div>
        <div id="rollback-banner" class="rollback-banner" hidden></div>
        <div id="pipeline" class="pipeline" aria-label="MADE 部署阶段流程"></div>
        <div class="pipeline-footnote"><span id="pipeline-progress" class="progress-label">等待运行数据</span></div>
      </section>

      <section class="detail-grid" aria-label="当前阶段详情与触发事件">
        <article class="panel detail-card current-card">
          <div class="card-heading"><div><div class="eyebrow">CURRENT STAGE</div><h2>当前阶段</h2></div><span id="current-stage-status" class="status-pill neutral">—</span></div>
          <div class="current-stage-content">
            <div id="current-stage-index" class="stage-index">—</div>
            <div id="current-stage-name" class="current-stage-name">等待阶段状态</div>
            <p id="current-stage-description" class="current-stage-description">运行开始后将在此显示当前执行阶段。</p>
          </div>
          <div id="current-stage-note" class="card-note">尚无阶段事件</div>
        </article>

        <article class="panel detail-card artifact-card">
          <div class="card-heading"><div><div class="eyebrow">ARTIFACT STATUS</div><h2>产物状态</h2></div><span id="artifact-count" class="count-label">0 项</span></div>
          <div id="artifact-stage" class="artifact-stage">等待阶段状态</div>
          <div id="artifact-summary" class="artifact-summary"></div>
          <div id="artifact-list" class="artifact-list"><div class="empty-message">当前阶段的产物状态将在此显示。</div></div>
        </article>

        <article class="panel detail-card triggers-card">
          <div class="card-heading"><div><div class="eyebrow">TRIGGER EVENTS</div><h2>触发事件</h2></div><span id="trigger-count" class="count-label">0 条</span></div>
          <div id="trigger-events" class="trigger-events"><div class="empty-message">正在读取事件记录。</div></div>
        </article>
      </section>

      <footer class="dashboard-footer"><span>MADE 本地部署监控</span><span>事件来源：流水线运行日志</span></footer>
    </main>
    <script src="/static/app.js?v=20261013-live-phase-motion"></script>
  </body>
</html>
